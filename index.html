<style>
/* VOICE: newsroom graphics desk with a wink — clear numbers first, playful objects second.
   IDEA: a banknote strap / bank vault receipt: money green fields, gold strap, engraved-feeling numerals.
   PICTURE: a balance scale — bundles of bills on one pan, elephants (or whatever fits) on the other.
   COLOUR and TYPE: banknote green dominant, white support, gold strap accent; Archivo wide 800 + Inter.
   LAYOUT: green hero band with input + scale, then a grid of comparison cards, then the method table. */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#0a110d);--ink:light-dark(#0e1a14,#e6eee8);--muted:light-dark(#4a5a51,#9db0a4);
 --money:light-dark(#0f4d32,#0d3324);--money2:light-dark(#0b3d27,#092619);--gold:#f5c542;
 --card:light-dark(#f1f6f2,#111b15);--line:light-dark(#d6e2da,#22342a);--acc:light-dark(#0e6a43,#7fd8a6)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,.num{font-family:Archivo,Inter,sans-serif;font-stretch:115%;letter-spacing:-.01em}
h1{font-size:clamp(32px,4.6vw,52px);line-height:1.05;font-weight:850;margin:0 0 10px;text-wrap:balance}
h2{font-size:clamp(26px,3vw,36px);line-height:1.1;font-weight:800;margin:0 0 6px}
.hero{background:radial-gradient(120% 90% at 85% 10%,#1b6b47 0,transparent 60%),var(--money);color:#f2faf4}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(20px,4vw,56px);align-items:center}
.lede{color:#cfe6d7;max-width:52ch;margin:0 0 22px}
.inrow{display:flex;gap:8px;flex-wrap:wrap}
.inrow input{flex:1 1 220px;font:700 clamp(20px,2.4vw,26px) Archivo,sans-serif;font-stretch:110%;padding:14px 16px;border-radius:12px;border:2px solid transparent;background:#fff;color:#0e1a14;min-height:56px}
.inrow select{flex:0 0 auto;font:600 17px Inter,sans-serif;padding:0 14px;border-radius:12px;border:2px solid transparent;background:#e7f3eb;color:#0e1a14;min-height:56px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lbl{font-size:13px;color:#b9d6c4;margin:14px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 14px Inter,sans-serif;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid #4f8a6c;background:transparent;color:#e6f4ea;cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#2b2100}
.chip:hover{border-color:var(--gold)}
.result{margin-top:26px;padding-top:20px;border-top:1px solid #3c7457}
.result .k{font-size:15px;color:#cfe6d7;margin:0}
.result .big{font-size:clamp(48px,8vw,92px);line-height:1;font-weight:900;color:var(--gold);white-space:nowrap;margin:4px 0 8px}
.result .say{font-size:clamp(18px,2vw,22px);margin:0;text-wrap:balance}
.result .say b{color:#fff}
.fig{position:relative;aspect-ratio:520/380;min-height:240px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.beam,.panL,.panR{transform-box:view-box}
.beam{transform-origin:260px 70px}
.tip .beam{animation:beam 1.3s cubic-bezier(.3,.7,.3,1)}
.tip .panL{animation:pl 1.3s cubic-bezier(.3,.7,.3,1)}
.tip .panR{animation:pr 1.3s cubic-bezier(.3,.7,.3,1)}
@keyframes beam{0%{transform:rotate(-6deg)}40%{transform:rotate(3.5deg)}70%{transform:rotate(-1.2deg)}100%{transform:rotate(0)}}
@keyframes pl{0%{transform:translateY(18px)}40%{transform:translateY(-10px)}70%{transform:translateY(3.5px)}100%{transform:none}}
@keyframes pr{0%{transform:translateY(-18px)}40%{transform:translateY(10px)}70%{transform:translateY(-3.5px)}100%{transform:none}}
.drop{animation:drop .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cap{font-size:13px;font-weight:600;color:var(--muted)}
.card .num{font-size:clamp(30px,3.2vw,40px);font-weight:850;line-height:1.05;color:var(--acc);white-space:nowrap}
.card p{margin:0}
.card .lab{font-weight:600;text-wrap:balance}
.card .note{font-size:14px;color:var(--muted)}
.icons{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;min-height:30px;margin:6px 0 2px;color:var(--acc)}
.ic{width:28px;height:28px;flex:none;animation:pop .4s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--d)*35ms + var(--i)*70ms)}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.part{display:inline-block;overflow:hidden;height:28px;flex:none}
.more{font:700 14px Inter,sans-serif;color:var(--muted);align-self:center;margin-left:4px}
.eqcard{grid-column:1/-1}
.eqs{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:4px}
.eq{display:flex;align-items:center;gap:8px;color:var(--acc)}
.eq span{color:var(--ink)}.card .eq b.num{font-size:26px;font-weight:800;color:var(--acc);margin-right:2px}
.eq .ic{width:34px;height:34px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.btn{font:600 16px Inter,sans-serif;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid transparent;background:var(--gold);color:#2b2100;cursor:pointer}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:#f2faf4;border-color:#4f8a6c}
.dlg{position:fixed;inset:0;background:rgba(4,15,10,.72);display:grid;place-items:center;padding:16px;z-index:10}
.dlg[hidden]{display:none}
.dlg .box{background:var(--bg);color:var(--ink);border-radius:18px;padding:18px;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:rise .3s both}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.dhead h2{font-size:24px;margin:0}
.dlg img{width:100%;max-height:55vh;object-fit:contain;border-radius:10px;background:#0f4d32;display:block}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap}
.dlg .chip{color:var(--ink);border-color:var(--line)}
.dlg .chip[aria-pressed=true]{color:#2b2100}
.dlg .btn.ghost{color:var(--ink);border-color:var(--line)}
.btn.x{min-width:44px;padding:0}
.status{font-size:14px;color:var(--muted);min-height:20px;margin:0}
.sub{color:var(--muted);max-width:68ch;margin:0}
table{border-collapse:collapse;width:100%;margin-top:18px;font-size:15px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;font-weight:600;color:var(--muted)}
tr.on td{background:var(--card);font-weight:600}
.method{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px)}
.method ul{margin:12px 0 0;padding-left:18px;color:var(--muted)}.method li{margin:4px 0}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
pre,.scroll{overflow-x:auto}
.hero{position:relative}
.lang{position:absolute;top:14px;right:max(5vw,16px);display:flex;gap:4px;z-index:2}
.lang .chip{min-height:32px;padding:4px 10px;font-size:13px}
@media(max-width:820px){.hero .wrap,.method{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){table{font-size:13px}th,td{padding:8px 6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function parseAmount(str){
 const s=String(str).toLowerCase().trim();
 const m=s.match(/^([\d.,\s]+)\s*(.*)$/);if(!m)return NaN;
 let n=m[1].replace(/\s/g,''),w=m[2].trim(),mult=1;
 if(/^trillion/.test(w))mult=1e12;
 else if(/^billion/.test(w))mult=1e9;
 else if(/^(bill[oó]n|billones)/.test(w))mult=1e12;
 else if(/^mil\s*mill/.test(w))mult=1e9;
 else if(/^(mill|m$|mn$)/.test(w))mult=1e6;
 else if(/^(mil$|k$|thousand)/.test(w))mult=1e3;
 else if(/^(b|bn)$/.test(w))mult=1e9;
 else if(/^k{2,4}$/.test(w))mult=1000**w.length;
 const d=n.lastIndexOf('.'),c=n.lastIndexOf(',');
 if(d>=0&&c>=0){const dec=d>c?'.':',';n=n.split(dec==='.'?',':'.').join('').replace(dec,'.')}
 else if(d>=0||c>=0){const sep=d>=0?'.':',',parts=n.split(sep);
  if(parts.length>2||parts[parts.length-1].length===3)n=parts.join('');else n=parts.join('.')}
 return parseFloat(n)*mult;
}

 <g class="panR"><path d="M430 70L380 240M430 70L480 240" stroke="#cfe6d7" stroke-width="2"/><circle cx="430" cy="70" r="5" fill="#f5c542"/>${ic}
  <path d="M368 240h124q-8 24-62 24t-62-24z" fill="#f5c542"/>${lbl(430,'× '+cnt(c))}</g>`;
 const f=$('fig');f.classList.remove('tip');void f.offsetWidth;f.classList.add('tip');
}

function update(){
 const t=L(),C=CUR[state.cur],cur=state.cur,amt=parseAmount($('amt').value);
 try{localStorage.setItem('cuantopesa',JSON.stringify({...state,amt:$('amt').value,lang}))}catch(e){}
 if(!(amt>0)){last=null;$('rk').textContent=t.empty;$('rkg').textContent='—';$('rsay').textContent='';$('gsub').textContent='';$('grid').innerHTML='';$('tbl').innerHTML='';return}
 const N=C.notes.find(n=>n.v===state.den),bills=amt/N.v,kg=bills*N.w/1000,den=money(N.v,cur);
 const vol=bills*N.L*N.W*N.T/1e6,h=bills*N.T/1000,len=bills*N.L/1000,area=bills*N.L*N.W/1e6;
 const hw=pick(W,kg);
 last={amt,cur,kg,hw,den,denV:N.v};
 try{if(!INPREVIEW)history.replaceState(null,'','?'+params())}catch(e){}
 $('rk').textContent=t.rk(money(amt,cur),nf(Math.ceil(bills)),den);
 countUp($('rkg'),kg,kgf);
 $('rsay').innerHTML=bills<1?t.lessOne(den):t.say(cnt(hw.c),nm(hw.o,hw.c));
 $('gsub').textContent=t.gsub(money(amt,cur),words(amt),den);
 drawScale(kg,hw.o,hw.c);
 const bv=pick(V,vol/.85),bh=pick(H,h),bl=pick(LN,len),ba=pick(AR,area);
 const cards=[
  [t.caps[0],kgf(kg),`${cnt(hw.c)} ${nm(hw.o,hw.c)}`,icons(hw.o[0],hw.c),t.each(sg(hw.o),kgf(hw.o[1]))],
  [t.caps[1],lf(vol),`${cnt(bv.c)} ${nm(bv.o,bv.c)}`,icons(bv.o[0],bv.c),t.volNote(sg(bv.o),lf(bv.o[1]))],
  [t.caps[2],mf(h),t.times(cnt(bh.c),sg(bh.o)),icons(bh.o[0],bh.c),t.hNote(nf(N.T,2))],
  [t.caps[3],mf(len),t.times(cnt(bl.c),sg(bl.o)),icons(bl.o[0],bl.c),t.lNote(nf(N.L,1))],
  [t.caps[4],af(area),`${cnt(ba.c)} ${nm(ba.o,ba.c)}`,icons(ba.o[0],ba.c),t.aNote],
  [t.caps[5],dur(bills),t.countLab,'',t.countNote(dur(bills*3))],
  ...[[t.splitIn(C.pop[0][lang]),C.pop[1]],[t.worldCap,8.2e9]].map(([cap,pop])=>[cap,money(amt/pop,cur),t.perHead,'',t.family(t.people(pop),money(amt/pop*4,cur))])
 ];
 const eqs=W.filter(o=>o[2][lang]).map(o=>[o,kg/o[1]]).filter(([o,c])=>c>=.05&&c<=1e6);
 const strip=eqs.length?`<article class="card eqcard" style="--i:0"><div class="cap">${t.sameW}</div><div class="eqs">${eqs.map(([o,c],j)=>`<div class="eq" style="--d:${j}"><svg class="ic" style="--d:${j}"><use href="#${o[0]}"/></svg><span><b class="num">${cnt(c)}</b> ${nm(o,c)}</span></div>`).join('')}</div></article>`:'';
 $('grid').innerHTML=strip+cards.map(([cap,num,lab,ic,note],i)=>`<article class="card" style="--i:${i+1}"><div class="cap">${cap}</div><div class="num">${num}</div><p class="lab">${lab}</p><div class="icons" style="--i:${i}">${ic}</div><p class="note">${note}</p></article>`).join('');
 $('tbl').innerHTML=`<thead><tr>${t.th.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>`+
  C.notes.map(n=>{const b=amt/n.v;return `<tr class="${n.v===N.v?'on':''}"><td>${money(n.v,cur)}</td><td>${nf(n.L,1)} × ${nf(n.W,1)} mm</td><td>${nf(n.w,2)} g</td><td>${nf(Math.ceil(b))}</td><td>${kgf(b*n.w/1000)}</td></tr>`}).join('')+'</tbody>';
 $('assume').innerHTML=[C.src[lang],t.thick(nf(N.T,2)),...t.assume].map(x=>`<li>${x}</li>`).join('');
}

let tm;
function liveFormat(el){
 const raw=el.value,d=lang==='es'?',':'.',g=lang==='es'?'.':',';
 const okChars=new RegExp('^[\\d'+(g==='.'?'\\.':',')+(d==='.'?'\\.':',')+']*$');
 if(!okChars.test(raw))return;
 const nd=raw.split(d).length-1;if(nd>1)return;
 const [ip,dp]=raw.split(d);
 let digits=ip.replace(/\D/g,'');if(!digits&&nd===0)return;
 digits=digits.replace(/^0+(?=\d)/,'');
 let out=(digits||'0').replace(/\B(?=(\d{3})+(?!\d))/g,g)+(nd?d+dp.replace(/\D/g,''):'');
 if(out===raw)return;
 const caret=el.selectionStart??raw.length;
 const sig=c=>/\d/.test(c)||c===d;
 let n=0;for(let i=0;i<caret;i++)if(sig(raw[i]))n++;
 if(!digits&&nd)n++;
 let pos=0;while(pos<out.length&&n>0){if(sig(out[pos]))n--;pos++}
 el.value=out;try{el.setSelectionRange(pos,pos)}catch(e){}
}
$('amt').addEventListener('input',e=>{if(!e.isComposing)liveFormat(e.target);clearTimeout(tm);tm=setTimeout(update,350)});
$('f').addEventListener('submit',e=>{e.preventDefault();update()});
$('cur').addEventListener('change',e=>{state.cur=e.target.value;state.den=CUR[state.cur].def;renderDens();update()});
$('dens').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;state.den=+b.dataset.d;renderDens();update()});
$('ex').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;$('amt').value=nf(+b.dataset.v);update()});
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b||b.dataset.l===lang)return;
 const v=parseAmount($('amt').value);lang=b.dataset.l;if(v>0)$('amt').value=nf(v,2);applyLang()});
const params=()=>new URLSearchParams({a:String(last.amt),c:last.cur,d:String(last.denV),l:lang}).toString();
const shareURL=()=>BASE+'?'+params();
const shareText=()=>{const t=L();return t.shareText(money(last.amt,last.cur),kgf(last.kg),cnt(last.hw.c),nm(last.hw.o,last.hw.c))};
function svgImage(){
 const defs=document.querySelector('svg defs').outerHTML;
 let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="1040" height="760">${defs}${$('scale').innerHTML}</svg>`;
 s=s.split('var(--card,#fff)').join('#0f4d32');
 return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)});
}
function wrapText(x,txt,X,y,maxW,lh){const ws=txt.split(' ');let line='';for(const w of ws){const test=line?line+' '+w:w;if(x.measureText(test).width>maxW&&line){x.fillText(line,X,y);line=w;y+=lh}else line=test}x.fillText(line,X,y);return y}
async function renderCard(fmt){
 const [Wd,Ht]=fmt==='story'?[1080,1920]:fmt==='wide'?[1200,630]:[1080,1350];
 const cv=document.createElement('canvas');cv.width=Wd;cv.height=Ht;const x=cv.getContext('2d');
 try{await Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('800 40px Archivo'),document.fonts.load('600 40px Inter')])}catch(e){}
 const g=x.createLinearGradient(0,0,Wd,Ht);g.addColorStop(0,'#1b6b47');g.addColorStop(.55,'#0f4d32');g.addColorStop(1,'#0a3322');x.fillStyle=g;x.fillRect(0,0,Wd,Ht);
 const img=await svgImage(),t=L(),wide=fmt==='wide',story=fmt==='story',pad=wide?60:80,colW=wide?520:Wd-pad*2;
 const font=(w,sz,f)=>{x.font=`${w} ${sz}px ${f==='a'?'Archivo, Inter, sans-serif':'Inter, sans-serif'}`};
 const fit=(txt,w,sz,max)=>{font(w,sz,'a');while(x.measureText(txt).width>max&&sz>20){sz-=2;font(w,sz,'a')}};
 let y=pad+(story?120:0);
 x.fillStyle='#cfe6d7';font(800,wide?30:44,'a');y+=wide?30:44;x.fillText(t.cardTitle,pad,y);
 y+=wide?66:120;x.fillStyle='#fff';const am=money(last.amt,last.cur);fit(am,800,wide?56:86,colW);x.fillText(am,pad,y);
 y+=wide?40:60;x.fillStyle='#b9d6c4';font(500,wide?24:38,'i');x.fillText(t.inBillsShort(last.den),pad,y);
 y+=wide?150:250;x.fillStyle='#f5c542';const k=kgf(last.kg);fit(k,900,wide?150:240,colW);x.fillText(k,pad,y);
 y+=wide?56:96;x.fillStyle='#fff';font(600,wide?28:48,'i');y=wrapText(x,t.sayPlain(cnt(last.hw.c),nm(last.hw.o,last.hw.c)),pad,y,colW,wide?36:60);
 if(img){if(wide){const sw=560,sh=sw*380/520;x.drawImage(img,Wd-pad-sw+20,(Ht-sh)/2-10,sw,sh)}
  else{const top=y+50,bottom=Ht-pad-60-(story?120:0);const sh=Math.min(bottom-top,(Wd-pad*2)*380/520),sw=sh*520/380;x.drawImage(img,(Wd-sw)/2,top+(bottom-top-sh)/2,sw,sh)}}
 x.fillStyle='#9cc7ad';font(500,wide?20:28,'i');x.fillText(SITE_LABEL,pad,Ht-pad+(wide?20:10)-(story?120:0));
 return cv;
}
window.__hhtm={renderCard};
let fmt='post',blob=null,opener=null;
async function refreshPreview(){
 const cv=await renderCard(fmt);$('prev').src=cv.toDataURL('image/png');$('prev').alt=shareText();
 blob=await new Promise(r=>cv.toBlob(r,'image/png'));
 let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[new File([blob],'x.png',{type:'image/png'})]}))}catch(e){}
 $('nativeShare').hidden=!can;
}
const status=m=>{$('st').textContent=m};
async function copy(txt,okMsg){try{await navigator.clipboard.writeText(txt);return okMsg}catch(e){return L().copyFail}}
function openDlg(){if(!last)return;opener=document.activeElement;$('dlg').hidden=false;status('');document.body.style.overflow='hidden';$('dlgX').focus();refreshPreview()}
function closeDlg(){$('dlg').hidden=true;document.body.style.overflow='';opener&&opener.focus()}
$('shareBtn').addEventListener('click',openDlg);
$('dlgX').addEventListener('click',closeDlg);
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dlg').hidden)closeDlg()});
$('fmt').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;fmt=b.dataset.f;document.querySelectorAll('#fmt [data-f]').forEach(c=>c.setAttribute('aria-pressed',c===b));refreshPreview()});
$('dl').addEventListener('click',()=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`how-heavy-${Math.round(last.amt)}-${last.cur}-${fmt}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);if(INPREVIEW)status(L().dlHint)});
$('nativeShare').addEventListener('click',async()=>{try{await navigator.share({files:[new File([blob],'how-heavy.png',{type:'image/png'})],text:shareText()+' '+shareURL()})}catch(e){}});
$('copy2').addEventListener('click',async()=>status(await copy(shareText()+' '+shareURL(),L().copiedLong)));
$('copyBtn').addEventListener('click',async()=>{const b=$('copyBtn'),m=await copy(shareURL(),L().copied);b.textContent=m===L().copied?'✓ '+m:L().copy;setTimeout(()=>{b.textContent=L().copy},1800)});
applyLang();
}
