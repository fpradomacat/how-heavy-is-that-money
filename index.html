<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How heavy is that money?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: newsroom graphics desk with a wink — clear numbers first, playful objects second.
   IDEA: a banknote strap / bank vault receipt: money green fields, gold strap, engraved-feeling numerals.
   PICTURE: a balance scale — bundles of bills on one pan, elephants (or whatever fits) on the other.
   COLOUR and TYPE: banknote green dominant, white support, gold strap accent; Archivo wide 800 + Inter.
   LAYOUT: green hero band with input + scale, then a grid of comparison cards, then the method table. */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#0a110d);--ink:light-dark(#0e1a14,#e6eee8);--muted:light-dark(#4a5a51,#9db0a4);
 --money:light-dark(#0f4d32,#0d3324);--money2:light-dark(#0b3d27,#092619);--gold:#f5c542;
 --card:light-dark(#f1f6f2,#111b15);--line:light-dark(#d6e2da,#22342a);--acc:light-dark(#0e6a43,#7fd8a6)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,.num{font-family:Archivo,Inter,sans-serif;font-stretch:115%;letter-spacing:-.01em}
h1{font-size:clamp(32px,4.6vw,52px);line-height:1.05;font-weight:850;margin:0 0 10px;text-wrap:balance}
h2{font-size:clamp(26px,3vw,36px);line-height:1.1;font-weight:800;margin:0 0 6px}
.hero{background:radial-gradient(120% 90% at 85% 10%,#1b6b47 0,transparent 60%),var(--money);color:#f2faf4}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(20px,4vw,56px);align-items:center}
.lede{color:#cfe6d7;max-width:52ch;margin:0 0 22px}
.inrow{display:flex;gap:8px;flex-wrap:wrap}
.inrow input{flex:1 1 220px;font:700 clamp(20px,2.4vw,26px) Archivo,sans-serif;font-stretch:110%;padding:14px 16px;border-radius:12px;border:2px solid transparent;background:#fff;color:#0e1a14;min-height:56px}
.inrow select{flex:0 0 auto;font:600 17px Inter,sans-serif;padding:0 14px;border-radius:12px;border:2px solid transparent;background:#e7f3eb;color:#0e1a14;min-height:56px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lbl{font-size:13px;color:#b9d6c4;margin:14px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 14px Inter,sans-serif;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid #4f8a6c;background:transparent;color:#e6f4ea;cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#2b2100}
.chip:hover{border-color:var(--gold)}
.result{margin-top:26px;padding-top:20px;border-top:1px solid #3c7457}
.result .k{font-size:15px;color:#cfe6d7;margin:0}
.result .big{font-size:clamp(48px,8vw,92px);line-height:1;font-weight:900;color:var(--gold);white-space:nowrap;margin:4px 0 8px}
.result .say{font-size:clamp(18px,2vw,22px);margin:0;text-wrap:balance}
.result .say b{color:#fff}
.fig{position:relative;aspect-ratio:520/380;min-height:240px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.beam,.panL,.panR{transform-box:view-box}
.beam{transform-origin:260px 70px}
.tip .beam{animation:beam 1.3s cubic-bezier(.3,.7,.3,1)}
.tip .panL{animation:pl 1.3s cubic-bezier(.3,.7,.3,1)}
.tip .panR{animation:pr 1.3s cubic-bezier(.3,.7,.3,1)}
@keyframes beam{0%{transform:rotate(-6deg)}40%{transform:rotate(3.5deg)}70%{transform:rotate(-1.2deg)}100%{transform:rotate(0)}}
@keyframes pl{0%{transform:translateY(18px)}40%{transform:translateY(-10px)}70%{transform:translateY(3.5px)}100%{transform:none}}
@keyframes pr{0%{transform:translateY(-18px)}40%{transform:translateY(10px)}70%{transform:translateY(-3.5px)}100%{transform:none}}
.drop{animation:drop .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cap{font-size:13px;font-weight:600;color:var(--muted)}
.card .num{font-size:clamp(30px,3.2vw,40px);font-weight:850;line-height:1.05;color:var(--acc);white-space:nowrap}
.card p{margin:0}
.card .lab{font-weight:600;text-wrap:balance}
.card .note{font-size:14px;color:var(--muted)}
.icons{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;min-height:30px;margin:6px 0 2px;color:var(--acc)}
.ic{width:28px;height:28px;flex:none;animation:pop .4s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--d)*35ms + var(--i)*70ms)}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.part{display:inline-block;overflow:hidden;height:28px;flex:none}
.more{font:700 14px Inter,sans-serif;color:var(--muted);align-self:center;margin-left:4px}
.sub{color:var(--muted);max-width:68ch;margin:0}
table{border-collapse:collapse;width:100%;margin-top:18px;font-size:15px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;font-weight:600;color:var(--muted)}
tr.on td{background:var(--card);font-weight:600}
.method{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px)}
.method ul{margin:12px 0 0;padding-left:18px;color:var(--muted)}.method li{margin:4px 0}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
pre,.scroll{overflow-x:auto}
.hero{position:relative}
.lang{position:absolute;top:14px;right:max(5vw,16px);display:flex;gap:4px;z-index:2}
.lang .chip{min-height:32px;padding:4px 10px;font-size:13px}
@media(max-width:820px){.hero .wrap,.method{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){table{font-size:13px}th,td{padding:8px 6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  t:{s:'segundos',m:'minutos',h:'horas',d:'días',y1:'año',y:'años'},liters:'litros',
  caps:['Peso','Volumen','Altura de la pila','Puestos en fila','Como alfombra','Contarlo a mano'],
  each:(n,v)=>`Cada ${n}: ~${v}.`,
  volNote:(n,v)=>`Fajos bien apilados, dejando un 15% de aire en cada ${n} (${v}).`,
  hNote:t=>`Un billete encima del otro, ${t} mm cada uno.`,
  lNote:l=>`Billete tras billete, por el lado largo (${l} mm).`,
  aNote:'Billetes uno al lado del otro, sin dejar huecos.',
  countLab:'a un billete por segundo, sin parar',countNote:d=>`Contando 8 horas por día: ${d}.`,
  split:[['Repartido en Argentina',46e6,'~46 millones de personas'],['Repartido en España',49e6,'~49 millones de personas']],
  perHead:'para cada habitante',family:(p,f)=>`Entre ${p}. Una familia de 4 recibiría ${f}.`,
  times:(c,n)=>`${c} × ${n}`,
  assume:['Bolso deportivo grande: 60 L (50 L útiles). Maletín: 12 L útiles. Contenedor de 20 pies: 33 m³.','Elefante africano ~6 t · auto compacto ~1,3 t · Boeing 737-800 vacío ~41 t · ballena azul ~150 t · hierro de la Torre Eiffel ~7.300 t.','Montos aceptados: 183.000.340 · 2,5 millones · 900 mil · 1,2 mil millones · 3 billones (en castellano, 1 billón = 1 millón de millones).'],
  thick:t=>`Grosor de cada billete: ~${t} mm.`}
};
const CUR={
 USD:{n:{en:'USD · US dollar',es:'USD · Dólar'},def:100,src:{en:'Every US banknote weighs 1 g and measures 156 × 66.3 mm (US Bureau of Engraving and Printing).',es:'Todos los billetes de dólar pesan 1 g y miden 156 × 66,3 mm (Oficina de Grabado e Impresión de EE.UU.).'},
  notes:[100,50,20,10,1].map(v=>({v,w:1.0,L:156,W:66.3,T:.11}))},
 EUR:{n:{en:'EUR · Euro',es:'EUR · Euro'},def:200,src:{en:'Sizes from the ECB; commonly cited approximate weights (0.6 g for €5 up to 1.1 g for €500). The €500 is no longer printed but is still legal tender.',es:'Medidas del BCE; pesos aproximados de uso común (0,6 g el de 5 € a 1,1 g el de 500 €). El de 500 € ya no se imprime pero sigue siendo de curso legal.'},
  notes:[{v:500,w:1.1,L:160,W:82},{v:200,w:1.1,L:153,W:77},{v:100,w:1.0,L:147,W:77},{v:50,w:.9,L:140,W:77},{v:20,w:.8,L:133,W:72},{v:10,w:.7,L:127,W:67}].map(n=>({...n,T:.11}))},
 ARS:{n:{en:'ARS · Argentine peso',es:'ARS · Peso argentino'},def:20000,src:{en:'Peso Line banknotes measure 155 × 65 mm (Central Bank of Argentina). Estimated weight ≈0.97 g each.',es:'Los billetes de la Línea Peso miden 155 × 65 mm (BCRA). Peso estimado ≈0,97 g por billete.'},
  notes:[20000,10000,2000,1000].map(v=>({v,w:.97,L:155,W:65,T:.11}))},
 GBP:{n:{en:'GBP · Pound sterling',es:'GBP · Libra esterlina'},def:50,src:{en:'Bank of England polymer notes (the £10 weighs ≈0.85 g); the others are estimated by area.',es:'Billetes de polímero del Banco de Inglaterra (el de £10 pesa ≈0,85 g); los demás, estimados por superficie.'},
  notes:[{v:50,w:1.05,L:146,W:77},{v:20,w:.95,L:139,W:73},{v:10,w:.85,L:132,W:69}].map(n=>({...n,T:.1}))},
 MXN:{n:{en:'MXN · Mexican peso',es:'MXN · Peso mexicano'},def:1000,src:{en:'Sizes from Banxico (G series, cotton paper); weight estimated by area.',es:'Medidas de Banxico (familia G, papel de algodón); peso estimado por superficie.'},
  notes:[{v:1000,w:.96,L:153,W:65},{v:500,w:.92,L:146,W:65},{v:200,w:.87,L:139,W:65}].map(n=>({...n,T:.11}))},
 BRL:{n:{en:'BRL · Brazilian real',es:'BRL · Real brasileño'},def:200,src:{en:'Sizes from the Central Bank of Brazil (2nd series); weight estimated by area.',es:'Medidas del Banco Central do Brasil (2ª familia); peso estimado por superficie.'},
  notes:[{v:200,w:.89,L:142,W:65},{v:100,w:1.06,L:156,W:70}].map(n=>({...n,T:.11}))}
};
// [icon, unit, {lang:[singular, plural]}] — an item without a language key is skipped in that language
const W=[['i-sugar',1,{en:['bag of sugar (1 kg)','bags of sugar (1 kg)'],es:['paquete de azúcar (1 kg)','paquetes de azúcar (1 kg)']}],
 ['i-person',75,{en:['adult','adults'],es:['persona adulta','personas adultas']}],
 ['i-cow',600,{en:['cow','cows'],es:['vaca','vacas']}],
 ['i-car',1300,{en:['compact car','compact cars'],es:['auto compacto','autos compactos']}],
 ['i-elephant',6000,{en:['African elephant','African elephants'],es:['elefante africano','elefantes africanos']}],
 ['i-plane',41400,{en:['empty Boeing 737','empty Boeing 737s'],es:['Boeing 737 vacío','Boeing 737 vacíos']}],
 ['i-whale',150000,{en:['blue whale','blue whales'],es:['ballena azul','ballenas azules']}],
 ['i-tower',7.3e6,{en:['Eiffel Tower (its ironwork)','Eiffel Towers (their ironwork)'],es:['Torre Eiffel (su hierro)','Torres Eiffel (su hierro)']}]];
const V=[['i-case',12,{en:['briefcase','briefcases'],es:['maletín ejecutivo','maletines ejecutivos']}],
 ['i-bag',50,{en:['large duffel bag','large duffel bags'],es:['bolso deportivo grande','bolsos deportivos grandes']}],
 ['i-fridge',350,{en:['fridge','fridges'],es:['heladera','heladeras']}],
 ['i-box',33000,{en:['20-ft shipping container','20-ft shipping containers'],es:['contenedor de 20 pies','contenedores de 20 pies']}],
 ['i-pool',2.5e6,{en:['Olympic pool','Olympic pools'],es:['pileta olímpica','piletas olímpicas']}]];
const H=[['i-person',1.75,{en:['person standing'],es:['persona parada']}],
 ['i-building',30,{en:['10-story building'],es:['edificio de 10 pisos']}],
 ['i-obelisk',67.5,{es:['Obelisco porteño']}],
 ['i-obelisk',93,{en:['Statue of Liberty (with pedestal)']}],
 ['i-tower',330,{en:['Eiffel Tower'],es:['Torre Eiffel']}],
 ['i-mountain',6961,{es:['Aconcagua']}],
 ['i-mountain',8849,{en:['Mount Everest'],es:['Everest']}],
 ['i-rocket',408000,{en:['Space Station orbit'],es:['órbita de la Estación Espacial']}],
 ['i-moon',384400000,{en:['trip to the Moon'],es:['viaje a la Luna']}]];
const LN=[['i-field',105,{en:['soccer field'],es:['cancha de fútbol']}],
 ['i-runner',42195,{en:['marathon'],es:['maratón']}],
 ['i-road',350000,{en:['New York–Boston drive']}],
 ['i-road',400000,{es:['Buenos Aires–Mar del Plata']}],
 ['i-road',620000,{es:['Madrid–Barcelona por ruta']}],
 ['i-road',4500000,{en:['coast-to-coast US drive']}],
 ['i-globe',40075000,{en:['lap around the Earth'],es:['vuelta a la Tierra']}],
 ['i-moon',384400000,{en:['distance to the Moon'],es:['distancia a la Luna']}]];
const AR=[['i-flat',50,{en:['50 m² apartment','50 m² apartments'],es:['departamento de 50 m²','departamentos de 50 m²']}],
 ['i-field',7140,{en:['soccer field','soccer fields'],es:['cancha de fútbol','canchas de fútbol']}],
 ['i-field',3.41e6,{en:['Central Park','Central Parks']}],
 ['i-city',59.1e6,{en:['Manhattan','Manhattans']}],
 ['i-city',203e6,{es:['Ciudad de Buenos Aires','Ciudades de Buenos Aires']}]];

const $=id=>document.getElementById(id);
let lang='en',state={cur:'USD',den:100};
const L=()=>T[lang];
const nf=(n,d=0)=>new Intl.NumberFormat(L().loc,{maximumFractionDigits:d,minimumFractionDigits:0}).format(n);
const cnt=n=>nf(n,n<1?2:n<10?1:0);
const money=(n,c)=>{const z=Number.isInteger(n)||n>=100?0:2;return new Intl.NumberFormat(lang==='es'&&c==='EUR'?'es-ES':L().loc,{style:'currency',currency:c,minimumFractionDigits:z,maximumFractionDigits:z}).format(n)};
const words=n=>{const w=L().words(n);return w?nf(n/w[1],2)+' '+w[0]:nf(n)};
const kgf=kg=>kg<1?nf(kg*1000,kg<.01?1:0)+' g':kg<1000?nf(kg,kg<10?1:0)+' kg':nf(kg/1000,kg<1e4?2:kg<1e5?1:0)+' t';
const mf=m=>m<1?nf(m*100,1)+' cm':m<1000?nf(m,m<10?2:0)+' m':nf(m/1000,m<1e4?1:0)+' km';
const lf=l=>l<1000?nf(l,l<10?1:0)+' '+L().liters:nf(l/1000,l<1e4?1:0)+' m³';
const af=a=>a<1e6?nf(a,a<10?1:0)+' m²':nf(a/1e6,1)+' km²';
const dur=s=>{const t=L().t;if(s<60)return nf(s)+' '+t.s;if(s<3600)return nf(s/60,1)+' '+t.m;if(s<86400)return nf(s/3600,1)+' '+t.h;const d=s/86400;if(d<365)return nf(d,d<10?1:0)+' '+t.d;const y=d/365.25;return nf(y,y<10?1:0)+' '+(y<2?t.y1:t.y)};
const pick=(list,val)=>{let best=null,bs=1e9;for(const o of list){if(!o[2][lang])continue;const c=val/o[1];const s=Math.abs(Math.log10(c)-.7)+(c<1?3:0);if(s<bs){bs=s;best=o}}return{o:best,c:val/best[1]}};
const sg=o=>o[2][lang][0];
const nm=(o,c)=>{const n=o[2][lang];return Math.abs(c-1)<.05||!n[1]?n[0]:n[1]};

function parseAmount(str){
 const s=String(str).toLowerCase().trim();
 const m=s.match(/^([\d.,\s]+)\s*(.*)$/);if(!m)return NaN;
 let n=m[1].replace(/\s/g,''),w=m[2].trim(),mult=1;
 if(/^trillion/.test(w))mult=1e12;
 else if(/^billion/.test(w))mult=1e9;
 else if(/^(bill[oó]n|billones)/.test(w))mult=1e12;
 else if(/^mil\s*mill/.test(w))mult=1e9;
 else if(/^(mill|m$|mn$)/.test(w))mult=1e6;
 else if(/^(mil$|k$|thousand)/.test(w))mult=1e3;
 else if(/^(b|bn)$/.test(w))mult=1e9;
 const d=n.lastIndexOf('.'),c=n.lastIndexOf(',');
 if(d>=0&&c>=0){const dec=d>c?'.':',';n=n.split(dec==='.'?',':'.').join('').replace(dec,'.')}
 else if(d>=0||c>=0){const sep=d>=0?'.':',',parts=n.split(sep);
  if(parts.length>2||parts[parts.length-1].length===3)n=parts.join('');else n=parts.join('.')}
 return parseFloat(n)*mult;
}

try{const s=JSON.parse(localStorage.getItem('cuantopesa')||'null');if(s&&CUR[s.cur]){state={cur:s.cur,den:s.den};if(s.amt)$('amt').value=s.amt;if(T[s.lang])lang=s.lang}}catch(e){}

function applyLang(){
 const t=L();document.documentElement.lang=lang;document.title=t.title;
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);
 document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
 $('amt').placeholder=t.ph;$('amt').setAttribute('aria-label',t.amtLbl);$('cur').setAttribute('aria-label',t.curLbl);
 $('scale').setAttribute('aria-label',t.scaleAria);
 $('cur').innerHTML=Object.keys(CUR).map(k=>`<option value="${k}">${CUR[k].n[lang]}</option>`).join('');$('cur').value=state.cur;
 $('ex').innerHTML=t.ex.map(([x,v])=>`<button type="button" class="chip" data-v="${v}">${x}</button>`).join('');
 renderDens();update();
}
function renderDens(){const C=CUR[state.cur];if(!C.notes.some(n=>n.v===state.den))state.den=C.def;
 $('dens').innerHTML=C.notes.map(n=>`<button type="button" class="chip" aria-pressed="${n.v===state.den}" data-d="${n.v}">${money(n.v,state.cur)}</button>`).join('')}

function countUp(el,to,fmt){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=fmt(to);return}
 const t0=performance.now(),d=900;cancelAnimationFrame(el._r);
 const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)el._r=requestAnimationFrame(step)};
 el._r=requestAnimationFrame(step);
}
function icons(id,c,max=20){
 let h='';const full=Math.floor(Math.min(c,max));
 for(let i=0;i<full;i++)h+=`<svg class="ic" style="--d:${i}"><use href="#${id}"/></svg>`;
 const fr=c<max?c-full:0;
 if(fr>.04)h+=`<span class="part" style="width:${(fr*28).toFixed(1)}px"><svg class="ic" style="--d:${full}"><use href="#${id}"/></svg></span>`;
 if(c>max)h+=`<span class="more">+ ${nf(c-max)}</span>`;
 return h;
}
const slots=(n,cx,w,h,gap)=>{const out=[];let row=0,left=n;while(left>0&&row<8){const y=240-(row+1)*h;const hw=50*(y-70)/170;const cap=Math.max(1,Math.floor((2*hw)/(w+gap)));const k=Math.min(cap,left);for(let i=0;i<k;i++)out.push([cx-(k*(w+gap)-gap)/2+i*(w+gap),y]);left-=k;row++}return out};
function drawScale(kg,o,c){
 const bundles=Math.max(1,Math.min(14,Math.round(2+Math.log10(Math.max(kg,.01))*2.2)));
 const bricks=slots(bundles,90,30,12,0).map(([x,y],i)=>{return `<g class="drop" style="animation-delay:${i*45}ms"><rect x="${x+1}" y="${y}" width="28" height="11" rx="2" fill="#e3f2e8" stroke="#0b3d27"/><rect x="${x+11}" y="${y}" width="8" height="11" fill="#f5c542" stroke="#0b3d27" stroke-width=".6"/></g>`}).join('');
 const show=Math.max(1,Math.min(6,Math.round(c)||1));
 const ic=slots(show,430,32,32,2).map(([x,y],i)=>`<use href="#${o[0]}" x="${x}" y="${y}" width="32" height="32" class="drop" style="animation-delay:${200+i*80}ms;color:#fff"/>`).join('');
 const lbl=(x,t)=>`<text x="${x}" y="292" text-anchor="middle" fill="#fff" font-family="Archivo,sans-serif" font-weight="800" font-size="22">${t}</text>`;
 $('scale').innerHTML=`
 <path d="M190 360h140l-18-26H208z" fill="#0a2e1f"/><rect x="253" y="70" width="14" height="266" rx="4" fill="#0a2e1f"/>
 <g class="beam"><rect x="70" y="63" width="380" height="14" rx="7" fill="#f5c542"/><circle cx="260" cy="70" r="12" fill="#f5c542" stroke="#0a2e1f" stroke-width="4"/></g>
 <g class="panL"><path d="M90 70L40 240M90 70L140 240" stroke="#cfe6d7" stroke-width="2"/><circle cx="90" cy="70" r="5" fill="#f5c542"/>${bricks}
  <path d="M28 240h124q-8 24-62 24t-62-24z" fill="#f5c542"/>${lbl(90,kgf(kg))}</g>
 <g class="panR"><path d="M430 70L380 240M430 70L480 240" stroke="#cfe6d7" stroke-width="2"/><circle cx="430" cy="70" r="5" fill="#f5c542"/>${ic}
  <path d="M368 240h124q-8 24-62 24t-62-24z" fill="#f5c542"/>${lbl(430,'× '+cnt(c))}</g>`;
 const f=$('fig');f.classList.remove('tip');void f.offsetWidth;f.classList.add('tip');
}

function update(){
 const t=L(),C=CUR[state.cur],cur=state.cur,amt=parseAmount($('amt').value);
 try{localStorage.setItem('cuantopesa',JSON.stringify({...state,amt:$('amt').value,lang}))}catch(e){}
 if(!(amt>0)){$('rk').textContent=t.empty;$('rkg').textContent='—';$('rsay').textContent='';$('gsub').textContent='';$('grid').innerHTML='';$('tbl').innerHTML='';return}
 const N=C.notes.find(n=>n.v===state.den),bills=amt/N.v,kg=bills*N.w/1000,den=money(N.v,cur);
 const vol=bills*N.L*N.W*N.T/1e6,h=bills*N.T/1000,len=bills*N.L/1000,area=bills*N.L*N.W/1e6;
 const hw=pick(W,kg);
 $('rk').textContent=t.rk(money(amt,cur),nf(Math.ceil(bills)),den);
 countUp($('rkg'),kg,kgf);
 $('rsay').innerHTML=bills<1?t.lessOne(den):t.say(cnt(hw.c),nm(hw.o,hw.c));
 $('gsub').textContent=t.gsub(money(amt,cur),words(amt),den);
 drawScale(kg,hw.o,hw.c);
 const bv=pick(V,vol/.85),bh=pick(H,h),bl=pick(LN,len),ba=pick(AR,area);
 const cards=[
  [t.caps[0],kgf(kg),`${cnt(hw.c)} ${nm(hw.o,hw.c)}`,icons(hw.o[0],hw.c),t.each(sg(hw.o),kgf(hw.o[1]))],
  [t.caps[1],lf(vol),`${cnt(bv.c)} ${nm(bv.o,bv.c)}`,icons(bv.o[0],bv.c),t.volNote(sg(bv.o),lf(bv.o[1]))],
  [t.caps[2],mf(h),t.times(cnt(bh.c),sg(bh.o)),icons(bh.o[0],bh.c),t.hNote(nf(N.T,2))],
  [t.caps[3],mf(len),t.times(cnt(bl.c),sg(bl.o)),icons(bl.o[0],bl.c),t.lNote(nf(N.L,1))],
  [t.caps[4],af(area),`${cnt(ba.c)} ${nm(ba.o,ba.c)}`,icons(ba.o[0],ba.c),t.aNote],
  [t.caps[5],dur(bills),t.countLab,'',t.countNote(dur(bills*3))],
  ...t.split.map(([cap,pop,who])=>[cap,money(amt/pop,cur),t.perHead,'',t.family(who,money(amt/pop*4,cur))])
 ];
 $('grid').innerHTML=cards.map(([cap,num,lab,ic,note],i)=>`<article class="card" style="--i:${i}"><div class="cap">${cap}</div><div class="num">${num}</div><p class="lab">${lab}</p><div class="icons" style="--i:${i}">${ic}</div><p class="note">${note}</p></article>`).join('');
 $('tbl').innerHTML=`<thead><tr>${t.th.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>`+
  C.notes.map(n=>{const b=amt/n.v;return `<tr class="${n.v===N.v?'on':''}"><td>${money(n.v,cur)}</td><td>${nf(n.L,1)} × ${nf(n.W,1)} mm</td><td>${nf(n.w,2)} g</td><td>${nf(Math.ceil(b))}</td><td>${kgf(b*n.w/1000)}</td></tr>`}).join('')+'</tbody>';
 $('assume').innerHTML=[C.src[lang],t.thick(nf(N.T,2)),...t.assume].map(x=>`<li>${x}</li>`).join('');
}

let tm;
$('amt').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(update,350)});
$('f').addEventListener('submit',e=>{e.preventDefault();update()});
$('cur').addEventListener('change',e=>{state.cur=e.target.value;state.den=CUR[state.cur].def;renderDens();update()});
$('dens').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;state.den=+b.dataset.d;renderDens();update()});
$('ex').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;$('amt').value=nf(+b.dataset.v);update()});
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b||b.dataset.l===lang)return;
 const v=parseAmount($('amt').value);lang=b.dataset.l;if(v>0)$('amt').value=nf(v,2);applyLang()});
applyLang();
}
</script>
